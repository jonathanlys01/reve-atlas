input:
  # This private cache is extracted from display.parquet and the original
  # shards; it contains embeddings only for the public display population.
  embeddings: /path/to/display_selection_source.parquet
  population: display

output:
  directory: data/real

rankings:
  - id: top_eta_001_per_recording
    direction: top
    scope: per_recording
    selection_eta: 0.01
  - id: bottom_eta_001_per_recording
    direction: bottom
    scope: per_recording
    selection_eta: 0.01
  - id: top_eta_010_per_recording
    direction: top
    scope: per_recording
    selection_eta: 0.10
  - id: bottom_eta_010_per_recording
    direction: bottom
    scope: per_recording
    selection_eta: 0.10

dpp:
  - candidates: top_eta_001_per_recording
    selection_eta: 0.01
    full_population: true
    kernels:
      multiplicative:
        w_interaction: [0, 0.125, 0.25, 0.5, 1, 2, 4, 8, 16, 32]
      additive:
        w_interaction: [0, 0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30]
  - candidates: bottom_eta_001_per_recording
    selection_eta: 0.01
    full_population: true
    kernels:
      multiplicative:
        w_interaction: [0, 0.125, 0.25, 0.5, 1, 2, 4, 8, 16, 32]
      additive:
        w_interaction: [0, 0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30]
  - candidates: top_eta_010_per_recording
    selection_eta: 0.10
    full_population: true
    kernels:
      multiplicative:
        w_interaction: [0, 0.125, 0.25, 0.5, 1, 2, 4, 8, 16, 32]
      additive:
        w_interaction: [0, 0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30]
  - candidates: bottom_eta_010_per_recording
    selection_eta: 0.10
    full_population: true
    kernels:
      multiplicative:
        w_interaction: [0, 0.125, 0.25, 0.5, 1, 2, 4, 8, 16, 32]
      additive:
        w_interaction: [0, 0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30]

numerics:
  epsilon: 1.0e-6
  max_workspace_gib: 8
