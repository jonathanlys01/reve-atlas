input:
  embeddings: /path/to/embedding_shards
  recording_metadata: /path/to/recording_metadata.parquet
  metadata_columns: [dataset, modality, sampling_rate, n_channels]

output:
  directory: data/real

projection:
  method: umap
  device: cuda
  seed: 0
  n_neighbors: 30
  min_dist: 0.1
  metric: cosine
  fit_sample_size: 200000
  transform_chunk_size: 50000

rankings:
  - id: top_global_5000
    direction: top
    scope: global
    candidate_k: 5000
  - id: bottom_global_5000
    direction: bottom
    scope: global
    candidate_k: 5000
  - id: top_per_recording_256
    direction: top
    scope: per_recording
    candidate_k: 256
  - id: bottom_per_recording_256
    direction: bottom
    scope: per_recording
    candidate_k: 256

dpp:
  - candidates: top_per_recording_256
    recording_indices: [42, 442]
    selection_k: 32
    kernels:
      multiplicative:
        w_interaction: [0, 0.125, 0.25, 0.5, 1, 2, 4, 8, 16, 32]
      additive:
        w_interaction: [0, 0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30]
  - candidates: bottom_per_recording_256
    recording_indices: [42, 442]
    selection_k: 32
    kernels:
      multiplicative:
        w_interaction: [0, 0.125, 0.25, 0.5, 1, 2, 4, 8, 16, 32]
      additive:
        w_interaction: [0, 0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30]

numerics:
  epsilon: 1.0e-6
  max_workspace_gib: 8
