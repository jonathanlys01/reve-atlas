input:
  embeddings: /path/to/embedding_shards
  recording_metadata: /path/to/recording_metadata.parquet
  metadata_columns: [dataset, modality, sampling_rate, n_channels]

output:
  directory: data/real

projection:
  method: umap
  device: cuda
  seed: 0
  n_neighbors: 30
  min_dist: 0.1
  metric: cosine
  fit_sample_size: 200000
  transform_chunk_size: 50000

rankings:
  - id: top_eta_001_per_recording
    direction: top
    scope: per_recording
    selection_eta: 0.01
  - id: bottom_eta_001_per_recording
    direction: bottom
    scope: per_recording
    selection_eta: 0.01
  - id: top_eta_010_per_recording
    direction: top
    scope: per_recording
    selection_eta: 0.10
  - id: bottom_eta_010_per_recording
    direction: bottom
    scope: per_recording
    selection_eta: 0.10

dpp:
  - candidates: top_eta_001_per_recording
    selection_eta: 0.01
    full_population: true
    kernels:
      multiplicative:
        w_interaction: [0, 0.125, 0.25, 0.5, 1, 2, 4, 8, 16, 32]
      additive:
        w_interaction: [0, 0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30]
  - candidates: bottom_eta_001_per_recording
    selection_eta: 0.01
    full_population: true
    kernels:
      multiplicative:
        w_interaction: [0, 0.125, 0.25, 0.5, 1, 2, 4, 8, 16, 32]
      additive:
        w_interaction: [0, 0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30]
  - candidates: top_eta_010_per_recording
    selection_eta: 0.10
    full_population: true
    kernels:
      multiplicative:
        w_interaction: [0, 0.125, 0.25, 0.5, 1, 2, 4, 8, 16, 32]
      additive:
        w_interaction: [0, 0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30]
  - candidates: bottom_eta_010_per_recording
    selection_eta: 0.10
    full_population: true
    kernels:
      multiplicative:
        w_interaction: [0, 0.125, 0.25, 0.5, 1, 2, 4, 8, 16, 32]
      additive:
        w_interaction: [0, 0.01, 0.03, 0.1, 0.3, 1, 3, 10, 30]

numerics:
  epsilon: 1.0e-6
  max_workspace_gib: 8
